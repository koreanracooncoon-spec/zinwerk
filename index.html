<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D3C78">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Zinwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow lesson column, Delft blue + Dutch orange; three Stufen stacked like a staircase */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#141C2E; --muted:#59627A; --line:#D5DBE8;
  --green:#1D3C78; --on-green:#F2F4F8; --gold:#F28C28; --gold-ink:#2B1400;
  --ok:#2E8B57; --ok-bg:#E4F3EA; --bad:#C2453B; --bad-bg:#FBE8E6; --chip:#E8EDF6;
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#161F35; --ink:#E8ECF5; --muted:#9AA6C0; --line:#2A3654;
  --green:#A9C4F5; --on-green:#0E1424; --gold:#F5A04A; --gold-ink:#2B1400;
  --ok:#5CC48A; --ok-bg:#16332A; --bad:#F07A6E; --bad-bg:#3A1F1C; --chip:#1D2843; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#161F35; --ink:#E8ECF5; --muted:#9AA6C0; --line:#2A3654;
  --green:#A9C4F5; --on-green:#0E1424; --gold:#F5A04A; --gold-ink:#2B1400;
  --ok:#5CC48A; --ok-bg:#16332A; --bad:#F07A6E; --bad-bg:#3A1F1C; --chip:#1D2843; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 220px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.brand h1 span{color:var(--gold)}
.lvl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.8rem}
.today{margin-top:16px;background:var(--green);color:var(--on-green);border-radius:20px;padding:18px;display:grid;gap:12px}
.today h2{font-size:1.4rem}
.today p{margin:0;opacity:.85}
.btn{width:100%;border:0;border-bottom:4px solid #0003;border-radius:14px;padding:14px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;background:var(--gold);color:var(--gold-ink)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.sec{margin-top:26px;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stufen{display:grid;gap:12px;margin-top:10px}
.stufe{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.stufe.locked{opacity:.6}
.stufe.current{border-color:var(--green)}
.st-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.st-head h3{font-size:1.15rem}
.st-head span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.pbar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:999px}
.lockmsg{font-size:.88rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:0;border-radius:999px;padding:5px 11px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.weak{background:var(--bad-bg);color:var(--bad)}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip:disabled{cursor:default}
.note{margin-top:24px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.note a{color:inherit}
.top{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted);padding:4px 8px}
.bar{flex:1;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.xp{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.tag{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--green)}
.tag .new{background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:0 6px;letter-spacing:.04em}
.qtitle{font-size:1.02rem;color:var(--muted);margin:6px 0 14px;font-family:var(--f-body);font-weight:400}
.sentence{font-family:var(--f-display);font-size:1.5rem;font-weight:500;line-height:1.38;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--gold);text-align:center;color:var(--green);font-weight:700}
.ko{margin-top:10px;color:var(--muted);font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 10px;font-size:1.05rem;font-weight:700}
.opt.sel{border-color:var(--green);background:var(--chip)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin-top:20px}
.pre{font-family:var(--f-display);font-size:1.15rem;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
.tok{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:1.05rem}
.tok.used{visibility:hidden}
.tok:disabled{cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;max-height:72%;overflow:auto}
.sheet .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;display:grid;gap:12px}
.sheet.ok{background:var(--ok-bg)} .sheet.bad{background:var(--bad-bg)}
.verdict{font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.ok .verdict{color:var(--ok)} .bad .verdict{color:var(--bad)}
.solution{font-weight:700}
.gram{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.96rem}
.gram h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.gram p{margin:0}
.gram .hint{font-weight:700;margin-bottom:6px}
.gram details{margin-top:8px}
.gram summary{cursor:pointer;color:var(--green);font-weight:700;font-size:.9rem}
.gram details p{margin-top:6px}
.src{font-size:.8rem;color:var(--muted)} .src a{color:inherit}
.end{text-align:center;padding-top:40px;display:grid;gap:14px;justify-items:center}
.end h2{font-size:2rem;color:var(--green)}
.big{font-family:var(--f-display);font-size:3.2rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.review{text-align:left;width:100%;display:grid;gap:8px}
.unlock{background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:12px 16px;font-weight:700}
@media (max-width:420px){.sentence{font-size:1.28rem}.opts{grid-template-columns:1fr}.brand h1{font-size:2rem}}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:8px}
.banner{width:100%;background:var(--green);color:var(--on-green);border-radius:16px;padding:14px 16px;display:grid;gap:4px;margin-top:10px}
.banner h3{font-size:1.15rem}
.banner small{opacity:.85}
.banner.locked{background:var(--line);color:var(--muted)}
.divider{font-size:.8rem;color:var(--muted);background:var(--chip);border-radius:999px;padding:3px 12px;text-align:center}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--x,0px))}
.node{width:72px;height:72px;border-radius:50%;border:0;border-bottom:6px solid #0002;display:grid;place-items:center;background:var(--line);color:var(--muted);transition:transform .1s}
.node:active{transform:translateY(3px)}
.node svg{width:30px;height:30px}
.node.done{background:var(--gold);color:var(--gold-ink)}
.node.cur{background:var(--green);color:var(--on-green);box-shadow:0 0 0 6px var(--bg),0 0 0 10px var(--green)}
.node.cp{border-radius:24px;width:84px}
.stars{display:flex;gap:2px;height:14px}
.stars svg{width:14px;height:14px}
.stars .on{fill:var(--gold)} .stars .off{fill:var(--line)}
.bubble{position:absolute;bottom:calc(100% + 14px);background:var(--surface);border:2px solid var(--line);color:var(--green);font-family:var(--f-display);font-weight:800;padding:4px 12px;border-radius:10px;white-space:nowrap;font-size:.9rem}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--line)}
@media (prefers-reduced-motion:no-preference){.node.cur{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--bg),0 0 0 14px var(--green)}}
.revbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:14px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 16px;text-align:left}
.revbtn b{font-family:var(--f-display);font-size:1.05rem}
.revbtn span{color:var(--muted);font-size:.9rem}
.sheet h3{font-size:1.3rem}
.meta{color:var(--muted);font-size:.92rem;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const POINTS=[{"id": "N1vt", "lv": 1, "name": "Perfect: hebben or zijn", "core": "The perfect is <b>hebben or zijn + past participle</b>. Most verbs take hebben. <b>zijn</b> is used for ① <b>movement towards a destination</b> (Ik <b>ben</b> naar huis gelopen) ② <b>change of state</b> (worden, beginnen, groeien, sterven) ③ zijn, blijven, gebeuren. The same movement verb takes hebben when you only say how much or how you moved: Ik <b>heb</b> veel gelopen. This destination rule is stricter than in German, where <i>ich bin viel gelaufen</i> is normal. Verbs with a direct object and reflexive verbs always take hebben.<br>Regular participles: <b>ge + stem + t/d</b>. If the stem ends in a consonant from 't kofschip (t, k, f, s, ch, p) use -t, otherwise -d: gewerkt, gebeld. Verbs starting with be-, ge-, her-, ver-, ont-, er- get no ge- (vertaald)."}, {"id": "N1sep", "lv": 1, "name": "Separable verbs", "core": "<b>Separable verbs</b> (opbellen, meenemen, aankomen, uitnodigen…) work like German trennbare Verben: in a main clause the <b>prefix goes to the end</b>: Ik <b>bel</b> je morgen <b>op</b>.<br>• In a subordinate clause they join up again at the end: …, omdat ik je morgen <b>opbel</b>.<br>• With a modal the joined infinitive goes to the end: Ik wil je <b>opbellen</b>.<br>• Participle: prefix + ge + stem: <b>opgebeld</b>, <b>meegenomen</b>.<br>• te-infinitive splits: <b>op te bellen</b> (German: anzurufen, but written as separate words in Dutch).<br>Stress on the prefix means separable; be-, ge-, her-, ver-, ont-, er- never separate."}, {"id": "N1ord", "lv": 1, "name": "Word order in subordinate clauses", "core": "After dat, omdat, als, of, toen, wanneer and question words (wat, waar, hoe…) the <b>finite verb goes to the end</b>, as in German: Ik weet <b>dat</b> hij morgen <b>komt</b>.<br>With two or more verbs you get a verb cluster at the end. <b>Unlike German</b>, Dutch order is flexible: dat hij het <b>gedaan heeft</b> / dat hij het <b>heeft gedaan</b> are both correct. Modal + infinitive is usually <b>modal first</b>: dat ik morgen <b>moet werken</b> (German: arbeiten muss).<br>If the subordinate clause comes first, the main clause starts with the <b>verb</b>: Als het regent, <b>blijf</b> ik thuis.<br>Distinguish <b>als</b> (if / when: present, future, repeated), <b>toen</b> (when: one past event, German <i>als</i>!) and <b>of</b> (whether, German <i>ob</i>)."}, {"id": "N1dehet", "lv": 1, "name": "de / het and demonstratives", "core": "Dutch has two genders for articles: <b>de-words</b> (former masculine and feminine) and <b>het-words</b> (neuter). <b>All plurals take de</b>. Diminutives (-je) are always <b>het</b> (het meisje), and so are infinitives used as nouns (het zwemmen). Gender often does <b>not</b> match German: het huis = das Haus, but de auto = das Auto.<br>Demonstratives follow the article: near <b>deze</b> (de) / <b>dit</b> (het), far or already mentioned <b>die</b> (de) / <b>dat</b> (het).<br>Hints: -ing, -heid, -ij, -teit, -tie → de; -ment, -isme, -um → het. Mostly, learn each noun with its article."}, {"id": "N1adj", "lv": 1, "name": "Adjective ending -e", "core": "Adjectives before a noun usually take <b>-e</b>: de grot<b>e</b> stad, mijn nieuw<b>e</b> fiets, grot<b>e</b> huizen. Much simpler than German!<br><b>The one exception</b>: a <b>singular het-word</b> with <b>een, geen, no article</b> (or elk, veel, wat) → <b>no ending</b>: een groot huis, geen koud water, lekker brood. With het, dit, dat, mijn etc. the -e comes back: <b>het grote huis</b>.<br>After the noun (predicative) there is never an ending: Het huis is groot.<br>Spelling: groot → grote, dik → dikke, lief → lieve, vies → vieze."}, {"id": "N1niet", "lv": 1, "name": "niet or geen", "core": "<b>geen</b> negates <b>een + noun</b> or a <b>noun without article</b> (German <i>kein</i>): Ik heb <b>geen</b> auto / <b>geen</b> tijd / Ze is <b>geen</b> lerares. Everything else takes <b>niet</b>.<br>Position of niet: by default <b>towards the end</b> (after objects and time adverbs): Ik zie hem vandaag <b>niet</b>. But it goes <b>before</b>:<br>• adjectives: Hij is <b>niet</b> ziek<br>• prepositional phrases: Ik ga <b>niet</b> naar huis<br>• separable prefixes: Ik bel hem <b>niet</b> op<br>• participles and infinitives: Ik heb het <b>niet</b> gezien / Ik kan <b>niet</b> komen"}, {"id": "N1imp", "lv": 1, "name": "Simple past (imperfectum)", "core": "Regular verbs: stem + <b>-te(n)</b> or <b>-de(n)</b>. Stem ending in a 't kofschip consonant (t, k, f, s, ch, p) → -te, otherwise -de: werken → werk<b>te</b>, wonen → woon<b>de</b>. Judge by the <b>infinitive</b>: leven (v) → leef<b>de</b>, verhuizen (z) → verhuis<b>de</b>. Plural -ten / -den.<br>Irregular verbs must be learned: zijn – was/waren, hebben – had/hadden, gaan – ging, komen – kwam, zien – zag, doen – deed, nemen – nam, zeggen – zei, lopen – liep, vinden – vond, kunnen – kon, moeten – moest.<br>Used for stories and background description; in conversation the perfect is more common, as in southern German."}, {"id": "N1conj", "lv": 1, "name": "omdat / want / dus / daarom", "core": "Similar meanings, different <b>word order</b> (compare German weil / denn / deshalb).<br>• <b>omdat</b> (because, subordinating) → verb at the <b>end</b>: …, omdat ik ziek <b>ben</b>. Can start a sentence.<br>• <b>want</b> (because, coordinating) → normal order: …, want ik <b>ben</b> ziek. Never at the start of a sentence.<br>• <b>daarom</b> (that's why, adverb) → <b>verb</b> right after: Daarom <b>blijf</b> ik thuis.<br>• <b>dus</b> (so) → normal order or inversion: dus ik blijf / dus blijf ik.<br>en, maar, of behave like want."}, {"id": "N2er", "lv": 2, "name": "The four uses of er", "core": "<b>er</b> is tiny but everywhere, and German has no single equivalent.<br>① <b>Existence</b> (there is, German <i>es gibt</i>): <b>Er</b> staat een man voor de deur. Used with an indefinite subject (een man, iemand, veel mensen).<br>② <b>Place</b> (there, German <i>dort/da</i>): Ik woon <b>er</b> al tien jaar.<br>③ <b>Quantity</b> (of them, German <i>davon</i>): Ik heb <b>er</b> drie. When you drop the noun after a number, veel or geen, er is required!<br>④ <b>er + preposition</b> (German <i>da(r)-</i>): Ik denk <b>er</b>aan. → see Level 3.<br>Also in passives without a subject: <b>Er</b> wordt gedanst."}, {"id": "N2te", "lv": 2, "name": "om … te and te + infinitive", "core": "<b>om … te + infinitive</b> = in order to (German <i>um … zu</i>): Ik ga naar de winkel <b>om</b> brood <b>te</b> kopen.<br>After adjectives, nouns and many verbs Dutch also prefers <b>(om) te</b>, even where German only has zu: Het is moeilijk <b>om</b> … <b>te</b> leren / Ik heb geen zin <b>om te</b> gaan / Ik probeer <b>te</b> slapen.<br><b>No te</b> after: <b>kunnen, moeten, willen, mogen, zullen, gaan, blijven, laten, zien, horen</b>: Ik wil slapen / Ik ga koken.<br>Separable verbs: op <b>te</b> bellen. <b>zonder … te</b> = without -ing, <b>in plaats van … te</b> = instead of -ing."}, {"id": "N2rel", "lv": 2, "name": "Relative pronouns die / dat / wat / waar-", "core": "If the antecedent is a <b>de-word or plural</b> use <b>die</b>; a <b>singular het-word</b> takes <b>dat</b>: de man <b>die</b>… / het huis <b>dat</b>…. People that are het-words still take dat (het meisje <b>dat</b>…). Dutch has no case here, unlike German der/den/dem.<br><b>wat</b> follows ① alles, iets, niets, veel ② a whole clause ③ superlatives like het mooiste.<br>With a preposition: people take <b>preposition + wie</b> (de vrouw <b>met wie</b> ik praat), things take <b>waar + preposition</b> (het huis <b>waarin</b> ik woon, de pen <b>waarmee</b> ik schrijf; German <i>womit</i>). met → mee.<br>The verb goes to the end of the relative clause."}, {"id": "N2vz", "lv": 2, "name": "Verbs with fixed prepositions", "core": "Each verb has its own preposition, and many differ from German, so learn them <b>as a set</b>.<br>wachten <b>op</b> (warten auf), denken <b>aan</b> (denken an), houden <b>van</b> (to love/like), zorgen <b>voor</b> (to take care of), luisteren <b>naar</b> (hören auf/zuhören), kijken <b>naar</b>, praten <b>over</b>, bang zijn <b>voor</b> (Angst vor), trots zijn <b>op</b> (stolz auf), zin hebben <b>in</b> (Lust auf!), afhangen <b>van</b>, genieten <b>van</b>, meedoen <b>aan</b>, zich ergeren <b>aan</b>, vragen <b>naar</b> (to ask about) / vragen <b>om</b> (to ask for, German <i>bitten um</i>)."}, {"id": "N2refl", "lv": 2, "name": "Reflexive verbs", "core": "Reflexive pronouns: ik → <b>me</b>, jij → <b>je</b>, u → <b>u / zich</b>, hij·zij·het → <b>zich</b>, wij → <b>ons</b>, jullie → <b>je</b>, zij (plural) → <b>zich</b>.<br>For emphasis or after a preposition use <b>mezelf, jezelf, zichzelf</b>: Hij praat over <b>zichzelf</b>.<br>Always reflexive: zich vergissen (to be mistaken), zich herinneren (to remember), zich voelen, zich haasten (to hurry), zich schamen, zich verheugen op (sich freuen auf), zich voorstellen (to introduce oneself / to imagine), zich vervelen (to be bored), zich aankleden.<br>Close to German sich, but the 1st/2nd person forms (me, je, ons) are easy to mix up."}, {"id": "N2comp", "lv": 2, "name": "Comparatives and superlatives", "core": "Comparative <b>-er</b> (groter, mooier), after r <b>-der</b> (duurder, verder). Superlative <b>-st</b> (grootst, het mooiste). Long words and participles can use <b>meer / meest</b>.<br>Irregular: goed – <b>beter</b> – best, veel – <b>meer</b> – meest, weinig – <b>minder</b> – minst, graag – <b>liever</b> – liefst (German: gern – lieber).<br>\"than\" is <b>dan</b> (German <i>als</i>!): groter <b>dan</b> ik. You will hear als in speech, but dan is the standard. Equal degree: <b>even … als</b> / <b>zo … als</b> (German <i>so … wie</i>).<br>Before a noun the normal -e rule applies: een snellere fiets, het grootste huis."}, {"id": "N2pass", "lv": 2, "name": "The passive", "core": "<b>worden + past participle</b>: Het huis <b>wordt</b> gebouwd (present), <b>werd</b> gebouwd (past).<br>The perfect is <b>zijn + participle</b> with <b>no worden</b>: Het huis <b>is</b> gebouwd. This is the big difference from German <i>ist gebaut worden</i>!<br>Agent: <b>door</b> (German <i>von</i>): door de gemeente. Passive without a subject uses <b>er</b>: Er wordt gedanst.<br>With modals: Het moet gedaan <b>worden</b> / Het moet <b>worden</b> gedaan."}, {"id": "N2zou", "lv": 2, "name": "zou / zouden", "core": "<b>zou/zouden + infinitive</b> works like German <i>würde</i>.<br>① <b>Hypothetical</b>: Als ik rijk <b>was</b>, <b>zou</b> ik reizen. The if-clause uses the simple past (was, had).<br>② <b>Polite requests</b>: <b>Zou</b> u mij kunnen helpen? / Ik <b>zou</b> graag … willen (German: ich hätte gern).<br>③ <b>Advice</b>: Ik <b>zou</b> dat niet doen.<br>④ <b>Future in the past</b>: Hij zei dat hij <b>zou</b> komen.<br>For a real, likely condition just use the present: Als het morgen mooi weer <b>is</b>, gaan we naar het strand."}, {"id": "N3ervz", "lv": 3, "name": "er / daar / waar + preposition", "core": "When a preposition refers to a <b>thing or idea</b>, Dutch never says het, dat or wat + preposition. It uses <b>er / daar / waar + preposition</b>, like German da(r)- / wo(r)-: <b>erop</b>, <b>daaraan</b>, <b>waarover</b>. met → <b>mee</b>, tot → <b>toe</b> (ermee, waarmee).<br>The big difference from German: in a main clause er and the preposition are <b>usually split</b>: Ik heb <b>er</b> niet <b>aan</b> gedacht / <b>Waar</b> wacht je <b>op</b>?<br>For people use preposition + pronoun: Ik denk aan <b>hem</b>.<br>It also anticipates a dat-clause or te-infinitive: Ik reken <b>erop</b> dat je komt."}, {"id": "N3ipp", "lv": 3, "name": "Verb clusters: infinitive instead of participle", "core": "When modals (kunnen, moeten, willen, mogen) and laten, gaan, blijven, zien, horen are in the perfect with another verb, they use the <b>infinitive</b> instead of the participle, just like the German Ersatzinfinitiv: Ik <b>heb</b> hem niet <b>kunnen</b> bellen (not gekund).<br>The order is fixed and the <b>opposite of German</b>: <b>hebben/zijn – modal – main verb</b>. Compare: …, omdat ik niet <b>heb kunnen komen</b> vs. weil ich nicht <b>habe kommen können</b>.<br>With gaan and blijven the auxiliary is <b>zijn</b>: Ik <b>ben</b> gaan wandelen.<br>\"should have\" = <b>had … moeten</b>: Je <b>had</b> het moeten zeggen."}, {"id": "N3conj", "lv": 3, "name": "B2 conjunctions", "core": "All subordinating conjunctions send the verb to the end. Common at B2:<br><b>hoewel</b> (although, obwohl), <b>zodra</b> (as soon as, sobald), <b>tenzij</b> (unless, es sei denn), <b>zodat</b> (so that, sodass), <b>terwijl</b> (while / whereas, während), <b>nadat</b> (after, usually with a perfect), <b>voordat</b> (before), <b>sinds</b> (since), <b>doordat</b> (because, for an unintended cause, dadurch dass), <b>mits</b> (provided that), <b>totdat</b> (until).<br>The adverbs <b>toch</b> (still / anyway), <b>bovendien</b> (moreover) and <b>daardoor</b> (as a result) take the verb right after them at the start of a sentence."}, {"id": "N3korr", "lv": 3, "name": "Paired conjunctions", "core": "Learn these as pairs.<br><b>zowel … als</b> (both … and, sowohl … als auch), <b>noch … noch</b> (neither … nor, weder … noch), <b>niet alleen … maar ook</b> (not only … but also), <b>ofwel … ofwel</b> / <b>óf … óf</b> (either … or), <b>enerzijds … anderzijds</b> (on the one hand … on the other).<br><b>hoe + comparative …, hoe + comparative</b> (the more … the more, je … desto): <b>Hoe</b> meer je oefent, <b>hoe</b> beter je <b>wordt</b>. Both clauses have the verb at the end. With <b>des te</b> in the second half the verb follows directly: …, des te beter <b>word</b> je."}, {"id": "N3vv", "lv": 3, "name": "Fixed noun + verb expressions", "core": "These <b>noun + verb pairs</b> make B2 speech and writing sound natural. Translating word by word from English or German usually goes wrong, so learn them whole.<br>rekening <b>houden</b> met (to take into account), een beslissing <b>nemen</b> (to make a decision; maken is an anglicism), een vraag <b>stellen</b> (to ask a question), contact <b>opnemen</b> met (to get in touch), een afspraak <b>maken</b> (to make an appointment), indruk <b>maken</b> op, gebruik <b>maken</b> van (to make use of), bezwaar <b>maken</b> tegen (to object to), een rol <b>spelen</b>, invloed <b>hebben</b> op, aandacht <b>besteden</b> aan (to pay attention to), in aanmerking <b>komen</b> voor (to be eligible for), ter sprake <b>komen</b> (to come up), in staat <b>zijn</b> om (to be able to)."}, {"id": "N3pqp", "lv": 3, "name": "Past perfect and past conditionals", "core": "<b>Past perfect</b> = <b>had / was + participle</b>: something that happened before another past moment. Toen ik aankwam, <b>was</b> de trein al <b>vertrokken</b>. hebben/zijn follow the same rules as the perfect.<br>An <b>unreal past condition</b> has two forms:<br>① Als ik het <b>had geweten</b>, <b>zou</b> ik gekomen <b>zijn</b>.<br>② Past perfect in both halves: Als ik het had geweten, <b>was</b> ik <b>gekomen</b>. This is more common in speech (compare German <i>wäre ich gekommen</i>).<br>Regret: <b>Had</b> ik het maar geweten! / <b>Was</b> je maar gekomen! (German: Hätte ich es nur gewusst!)"}, {"id": "N3inv", "lv": 3, "name": "Word order: inversion and the middle field", "core": "Main clauses are <b>V2</b>, as in German: the finite verb is always in <b>second position</b>. If something other than the subject comes first (time, place, object, a subordinate clause), the order is <b>verb → subject</b>.<br>The default middle field is <b>time – manner – place</b>: Ik ga <b>morgen met de trein naar Utrecht</b>. (Putting place first isn't wrong.)<br>Pronoun objects come early: Ik heb <b>het hem</b> gegeven.<br>Watch out: after inversion the verb <b>drops its -t before je/jij</b>: Je werkt → Werk je? / Morgen <b>ben</b> je vrij. German has nothing like this."}, {"id": "N4prep", "lv": 4, "name": "Formal prepositions", "core": "Formal Dutch (news, letters, reports) uses many compound and old-case prepositions. Most take a plain noun phrase, unlike German genitive prepositions.<br><b>dankzij</b> (thanks to), <b>ondanks</b> (despite, trotz), <b>wegens</b> (because of, wegen), <b>gezien</b> (given), <b>tijdens</b> (during), <b>ten aanzien van</b> / <b>met betrekking tot</b> (regarding, bezüglich), <b>naar aanleiding van</b> (following, in response to), <b>in het kader van</b> (as part of), <b>ten behoeve van</b> (for the benefit of), <b>ter gelegenheid van</b> (on the occasion of), <b>ten gevolge van</b> (as a result of), <b>in plaats van</b> (instead of).<br>The ter / ten forms are fossilised datives: <b>ter</b> + de-word (ter ere van), <b>ten</b> + het-word (ten behoeve van)."}, {"id": "N4part", "lv": 4, "name": "Participles as adjectives", "core": "C1 texts compress relative clauses into <b>participle phrases before the noun</b>, much as German does.<br>• Past participle = passive / completed: de <b>gestolen</b> fiets, het <b>door hem geschreven</b> boek (= het boek dat hij geschreven heeft).<br>• Present participle (-<b>end</b>) = active / ongoing: een <b>lachend</b> kind, de <b>stijgende</b> prijzen, <b>Al lachend</b> liep ze weg.<br>• <b>te</b> + infinitive + -e = \"to be done\": de <b>te lezen</b> tekst, het <b>te betalen</b> bedrag (German: der zu zahlende Betrag, but Dutch adds no -nd-).<br>Participles take the normal -e: een gestolen fiets (participle in -en takes no extra -e), de <b>verkochte</b> auto."}, {"id": "N4prog", "lv": 4, "name": "Progressive and te-constructions", "core": "Dutch expresses \"be doing\" in two ways German lacks in the standard language:<br>• <b>aan het + infinitive</b>: Ik ben <b>aan het koken</b>. Separable verbs stay joined (aan het opruimen).<br>• Position verb + <b>te</b> + infinitive: Hij <b>zit te lezen</b>, Ze <b>staat te wachten</b>, Het kind <b>ligt te slapen</b>. In the perfect it becomes infinitive-infinitive: Ik heb <b>zitten lezen</b> (te disappears).<br><b>hoeven</b> (need) is used only with a negation or \"only\" and takes <b>te</b>: Je <b>hoeft</b> niet <b>te</b> komen (German: du brauchst nicht zu kommen). Its perfect: Ik heb niet <b>hoeven</b> werken.<br><b>staan</b> + te + infinitive also means \"be about to / be scheduled\": Er <b>staat</b> veel <b>te gebeuren</b>."}, {"id": "N4conj", "lv": 4, "name": "Formal connectors", "core": "Written C1 Dutch links ideas with formal connectors. Watch the word order each one takes.<br>Subordinating (verb at the end): <b>aangezien</b> (since / as, da), <b>ofschoon</b> (although, formal), <b>opdat</b> (so that, damit), <b>naarmate</b> (as / the more), <b>temeer daar / omdat</b> (all the more because), <b>zij het</b> (albeit; no verb needed).<br>Adverbs (verb directly after at the start): <b>desondanks</b> (nevertheless, trotzdem), <b>derhalve</b> (therefore, formal), <b>bijgevolg</b> (consequently), <b>immers</b> (after all, ja/doch, usually in the middle), <b>althans</b> (at least), <b>overigens</b> (incidentally)."}, {"id": "N4idiom", "lv": 4, "name": "Idioms", "core": "Idioms are what make C1 Dutch sound native. Many are untranslatable, so learn the whole phrase and its meaning.<br>met de deur in huis vallen (get straight to the point), de kat uit de boom kijken (wait and see), iets onder de knie hebben (have mastered something), door de mand vallen (be found out), de draad kwijt zijn (lose the thread), voor de hand liggen (be obvious), uit de hand lopen (get out of hand), aan de slag gaan (get to work), iemand op de hoogte houden (keep someone informed), het hoofd boven water houden (keep your head above water), een oogje in het zeil houden (keep an eye on things), tussen de regels door lezen, de spijker op de kop slaan (hit the nail on the head), een appeltje te schillen hebben met (have a bone to pick with)."}, {"id": "N4pron", "lv": 4, "name": "hun / hen / ze and formal pronouns", "core": "The third-person plural object has three forms in Dutch.<br>• <b>ze</b>: the normal, unstressed form, for people and things: Ik zie <b>ze</b>.<br>• <b>hen</b>: stressed, for people, as direct object and after prepositions (formal rule): Ik heb <b>hen</b> gezien / met <b>hen</b>.<br>• <b>hun</b>: stressed, for people, as indirect object without preposition: Ik heb <b>hun</b> een cadeau gegeven.<br><b>hun</b> as a subject (\"Hun hebben…\") is very common in speech but is <b>wrong</b> in standard Dutch.<br>Formal possessives: <b>diens</b> (his, referring to the last-mentioned man, to avoid ambiguity: Jan sprak met Piet en <b>diens</b> vrouw), <b>wiens</b> / <b>wier</b> (whose: man/het-word → wiens, woman/plural → wier)."}];

/* ---------- path ---------- */
const NODES=[];
[1,2,3,4].forEach(lv=>{
  POINTS.filter(p=>p.lv===lv).forEach(p=>{
    const its=ITEMS.filter(i=>i.p===p.id).sort((a,b)=>a.ord-b.ord);
    const k=Math.ceil(its.length/8), size=Math.ceil(its.length/k);
    for(let j=0;j<k;j++) NODES.push({id:p.id+'-'+(j+1),lv,p:p.id,part:j+1,parts:k,items:its.slice(j*size,(j+1)*size)});

    const ic=n.cp?ICON.cup:nodeDone(n)?ICON.check:n.k===ci?ICON.play:ICON.lock;
    const label=n.cp?`Level ${n.lv} test`:`${PT[n.p].name} ${n.part}/${n.parts}`;
    html+=`<div class="nw" style="--x:${x}px">${n.k===ci?'<span class="bubble">Start</span>':''}<button class="node ${cls}${n.cp?' cp':''}" data-k="${n.k}" aria-label="${esc(label)}">${ic}</button>${nodeDone(n)?stars(n):''}</div>`;
  });
  html+=`</div>
  <p class="note">Each circle has 6–8 questions. Finish one to unlock the next; your first-try score earns 1–3 stars (90% or more for three). Score 80% on a level test to unlock the next level.<br>About half the sentences are by native speakers from <a href="https://tatoeba.org" target="_blank" rel="noopener">Tatoeba</a> (CC BY 2.0 FR); the rest are written for B1–C1 grammar (NT2 Staatsexamen I–II and beyond). Grammar notes compare Dutch with German where that helps. Progress is saved in this browser.</p>`;
  app.innerHTML=html;
  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>openNode(NODES[+b.dataset.k]));
  const rv=document.getElementById('rev'); if(rv) rv.onclick=()=>start(d.slice(0,10),{kind:'review'});
  const cur=app.querySelector('.node.cur'); if(cur) requestAnimationFrame(()=>cur.scrollIntoView({block:'center'}));
}
function openNode(n){
  sheet.hidden=false; sheet.className='sheet';
  if(!nodeOpen(n)){
    sheetIn.innerHTML=`<h3>Not unlocked yet</h3><p class="meta">Finish the circles before this one first.</p><button class="btn ghost" id="close">Close</button>`;
    document.getElementById('close').onclick=()=>sheet.hidden=true; return;
  }
  if(n.cp){
    sheetIn.innerHTML=`<h3>Level ${n.lv} test</h3><p class="meta">15 questions from all of Level ${n.lv}. Get 80% right on the first try to ${n.lv<4?`unlock Level ${n.lv+1}`:'finish the course'}.</p>
      <button class="btn" id="go">${nodeDone(n)?'Retake':'Take the test'}</button><button class="btn ghost" id="close">Close</button>`;
    document.getElementById('go').onclick=()=>start(shuffle(n.items).slice(0,15),{kind:'cp',node:n});
  } else {
    const P=PT[n.p];
    sheetIn.innerHTML=`<h3>${esc(P.name)} ${n.part}/${n.parts}</h3><p class="meta">Level ${n.lv} · ${n.items.length} questions${due().length?' + 2 review':''}${nodeDone(n)?' · replay to earn more stars':''}</p>
      <div class="gram"><h4>Grammar first</h4><details${seen(n.items[0].id)?'':' open'}><summary>Grammar notes</summary><p>${P.core}</p></details></div>
      <button class="btn" id="go">${nodeDone(n)?'Play again':'Start'}</button><button class="btn ghost" id="close">Close</button>`;
    document.getElementById('go').onclick=()=>{const rv=due().filter(i=>!n.items.includes(i)).slice(0,2);start(n.items.concat(rv),{kind:'node',node:n,rev:rv.length})};
  }
  document.getElementById('close').onclick=()=>sheet.hidden=true;
}

/* ---------- lesson ---------- */
function start(list,opt){
  if(!list.length)return;
  L=Object.assign({list:shuffle(list),i:0,done:0,total:list.length,xp:0,wrong:[],retry:new Set(),firstOk:0,lvBefore:curLevel()},opt);
  show(); window.scrollTo(0,0);
}
function show(){
  sheet.hidden=true;
  const q=L.list[L.i], pct=Math.round(L.done/L.total*100), isNew=!seen(q.id), P=PT[q.p];
  let body='';
  if(q.t==='gap'){
    const parts=q.q.split('___');
    body=`<h2 class="qtitle">${INST[q.p]||'Fill in the gap'}</h2>
      <p class="sentence">${esc(parts[0])}<span class="gap" id="gap">&nbsp;</span>${esc(parts[1])}</p>
      <p class="ko">${esc(q.ko)}</p>
      <div class="opts">${shuffle(q.o).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    let bank=shuffle(q.s),k=0; while(bank.join(' ')===q.s.join(' ')&&k++<10) bank=shuffle(q.s);
    body=`<h2 class="qtitle">Tap the words to build the sentence in the right order</h2>
      <p class="ko" style="margin-top:0">${esc(q.ko)}</p>
      <div class="answer" id="ans">${q.pre?`<span class="pre">${esc(q.pre)}</span>`:''}<span id="slot" style="display:contents"></span>${q.post?`<span class="pre">${esc(q.post)}</span>`:''}</div>
      <div class="bank" id="bank">${bank.map(w=>`<button class="tok">${esc(w)}</button>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="Quit lesson">×</button><div class="bar"><i style="width:${pct}%"></i></div><span class="xp">${L.xp} XP</span></div>
    <div class="tag"><b>Level ${P.lv}</b><span>·</span><span>${esc(P.name)}</span>${isNew?'<span class="new">NIEUW</span>':''}</div>${body}`;
  document.getElementById('quit').onclick=home;
  sheet.hidden=false; sheet.className='sheet';
  sheetIn.innerHTML=`<button class="btn" id="check" disabled>Check</button>`;
  const check=document.getElementById('check');
  if(q.t==='gap'){
    let sel=null;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); sel=b.dataset.v; document.getElementById('gap').textContent=sel; check.disabled=false;
    });
    check.onclick=()=>{
      const ok=sel===q.a;
      app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.a)b.classList.add('right');else if(b.dataset.v===sel)b.classList.add('wrong')});
      result(ok,q.q.replace('___',q.a));
    };
  } else {
    const slot=document.getElementById('slot'), picked=[];
    const upd=()=>check.disabled=picked.length!==q.s.length;
    app.querySelectorAll('#bank .tok').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('used'))return;
      b.classList.add('used');
      const c=document.createElement('button'); c.className='tok'; c.textContent=b.textContent;
      picked.push({w:b.textContent,el:c});
      c.onclick=()=>{if(c.disabled)return;const k=picked.findIndex(p=>p.el===c);picked.splice(k,1);c.remove();b.classList.remove('used');upd()};
      slot.appendChild(c); upd();
    });
    check.onclick=()=>{
      const got=picked.map(p=>p.w).join(' ');
      const ok=[q.s,...(q.alt||[])].some(a=>a.join(' ')===got);
      app.querySelectorAll('.tok').forEach(b=>b.disabled=true);
      result(ok,[q.pre,q.s.join(' '),q.post].filter(Boolean).join(' '));
    };
  }
}
function result(ok,solution){
  const q=L.list[L.i], P=PT[q.p], first=!L.retry.has(L.i), t=dayNum();
  if(first){
    const b=box(q.id);
    if(ok){const nb=Math.min((b||1)+1,6);st.p[q.id]=[nb,t+GAPS[nb]];L.xp+=10;L.firstOk++;}
    else{st.p[q.id]=[1,t+1];}
  } else if(ok) L.xp+=5;
  if(ok) L.done++; else { if(!L.wrong.includes(q))L.wrong.push(q); L.list.push(q); L.retry.add(L.list.length-1); }
  save();
  const src=q.id[0]==='T'?`<span class="src">Sentence by a native speaker: <a href="https://tatoeba.org/en/sentences/show/${q.id.slice(1)}" target="_blank" rel="noopener">Tatoeba #${q.id.slice(1)}</a></span>`:'';
  sheet.className='sheet '+(ok?'ok':'bad');
  sheetIn.innerHTML=`<div class="verdict">${ok?'Goed zo! Correct':'Bijna! Not quite'}</div>
    ${ok?'':`<div><small>Correct answer</small><div class="solution">${esc(solution)}</div></div>`}
    <div class="gram"><h4>Grammar · ${esc(P.name)}</h4><p class="hint">${esc(q.h)}</p>
      <details${ok?'':' open'}><summary>${ok?'Show grammar notes':'Grammar notes'}</summary><p>${P.core}</p></details></div>
    ${src}
    <button class="btn" id="next">Continue</button>`;
  sheet.scrollTop=0;
  const nx=document.getElementById('next'); nx.onclick=()=>{L.i++; if(L.i>=L.list.length)finish(); else show();}; nx.focus();
}
function finish(){
  sheet.hidden=true;
  const d=dayKey();
  if(st.last!==d){const y=dayKey(new Date(Date.now()-864e5));st.streak=(st.last===y)?st.streak+1:1;st.last=d;}
  const acc=L.firstOk/L.total, s=acc>=0.9?3:acc>=0.7?2:1;
  let head='Les gehaald!', extra='';
  if(L.kind==='node'){ st.n[L.node.id]=Math.max(st.n[L.node.id]||0,s); L.xp+=10; }
  if(L.kind==='cp'){
    if(acc>=0.8){ st.n[L.node.id]=Math.max(st.n[L.node.id]||0,s); L.xp+=30; head='Toets gehaald!';
      extra=`<div class="unlock">${L.node.lv<4?`Level ${L.node.lv+1} · ${STUFEN[L.node.lv+1]} is unlocked!`:'You have finished every level!'}</div>`; }
    else { head='Bijna gehaald!'; extra=`<p class="ko">First-try score ${Math.round(acc*100)}%. You need 80% to pass. Replay the circles you found hard and try again.</p>`; }
  }
  st.xp+=L.xp; save();
  const pts=[...new Set(L.wrong.map(q=>q.p))];
  const showStars=(L.kind==='node'||(L.kind==='cp'&&acc>=0.8));
  app.innerHTML=`<div class="end">
    <h2>${head}</h2>
    ${showStars?`<div class="stars" style="height:40px;gap:6px">${[1,2,3].map(k=>ICON.star.replace('<svg','<svg style="width:40px;height:40px" class="'+(k<=s?'on':'off')+'"')).join('')}</div>`:''}
    <div class="big">+${L.xp} XP</div>
    <p>Right first time ${L.firstOk}/${L.total} · ${st.streak}-day streak</p>
    ${extra}
    ${pts.length?`<div class="review"><p class="sec" style="margin:8px 0 0">Grammar to review</p>${pts.map(p=>`<div class="gram"><h4>${esc(PT[p].name)}</h4><p>${PT[p].core}</p></div>`).join('')}</div>`:''}
    <button class="btn" id="back">Back to the path</button></div>`;
  document.getElementById('back').onclick=home;
  window.scrollTo(0,0);
}
home();
</script>
